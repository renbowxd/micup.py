[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micup"
version = "0.1.4"
description = "Micup platformu için Python kütüphanesi."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9",
    "livekit",
]

[tool.setuptools]
packages = ["micup"]
